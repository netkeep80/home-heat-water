name: TypeScript model
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: node scripts/render-readme.mjs --check
      - run: npm run scenarios
      - name: Checkout pinned RepoGuard v5.0.0 compiler for MDDB materialization replay
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: netkeep80/repo-guard
          ref: 98670b6f8638ceb4495fa77474efee468a4ebb81
          path: .repo-guard-v5
          persist-credentials: false
      - name: Verify README is a real RepoGuard v5 generated Projection
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix .repo-guard-v5 --omit=dev --ignore-scripts --no-audit --no-fund
          node scripts/render-readme.mjs --outputs > "$RUNNER_TEMP/readme-outputs.json"
          CURRENT_HEAD="$(git rev-parse HEAD)"
          node .repo-guard-v5/dist/repo-guard.mjs --repo-root "$GITHUB_WORKSPACE" build             --base "$CURRENT_HEAD" --head "$CURRENT_HEAD"             --outputs "$RUNNER_TEMP/readme-outputs.json"
          node scripts/render-readme.mjs --check
