format: repo-guard/requirement-v1
id: HW-LANG
normative: "Все требования и метатребования проекта, включая будущие нормативные формулировки и требования-кандидаты, должны быть изложены на русском языке. Разрешены машинные идентификаторы и общепринятые названия технологий; англоязычные повествовательные формулировки недопустимы. Автоматическая проверка должна отклонять несоответствующие требования."
